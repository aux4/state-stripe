name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Stripe CLI
        run: npm install --global @stripe/cli
      - uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build
      - run: npm test
